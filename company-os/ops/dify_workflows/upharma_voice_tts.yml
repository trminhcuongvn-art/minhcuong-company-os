app:
  description: 'Nhập nội dung chương trình khuyến mãi → AI viết script phát thanh
    → tạo file âm thanh MP3 phát loa nhà thuốc'
  icon: 🎙️
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: Upharma Voice TTS
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-write_script
      source: start
      target: write_script
      type: custom
    - id: write_script-end
      source: write_script
      target: end
      type: custom
    nodes:
    - data:
        title: Start
        type: start
        variables:
        - label: Nội dung chương trình khuyến mãi
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: promo_content
        - label: Tên nhà thuốc
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: pharmacy_name
        - label: Thời lượng audio (giây)
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: duration_seconds
      height: 116
      id: start
      position:
        x: 50
        y: 200
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Viết script phát thanh từ nội dung khuyến mãi
        model:
          completion_params:
            temperature: 0.4
            max_tokens: 600
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: "Bạn là chuyên gia viết script phát thanh cho nhà thuốc Việt Nam.\nQuy\
            \ tắc:\n- Giọng văn trang trọng, thân thiện, rõ ràng\n- Bắt đầu bằng\
            \ \"Kính chào quý khách đến với {{#start.pharmacy_name#}}\"\n- Nêu rõ\
            \ tên chương trình, sản phẩm, mức giảm giá, thời hạn\n- Kết thúc bằng\
            \ lời mời mua hàng\n- Không dùng ký tự đặc biệt, emoji\n- Độ dài phù\
            \ hợp khi đọc khoảng {{#start.duration_seconds#}} giây"
        - role: user
          text: "Nhà thuốc: {{#start.pharmacy_name#}}\nNội dung: {{#start.promo_content#}}"
        title: Viết script phát thanh
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: write_script
      position:
        x: 380
        y: 200
      type: custom
      width: 244
    - data:
        outputs:
        - value_selector:
          - write_script
          - text
          variable: script
        title: End
        type: end
      height: 54
      id: end
      position:
        x: 710
        y: 200
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
