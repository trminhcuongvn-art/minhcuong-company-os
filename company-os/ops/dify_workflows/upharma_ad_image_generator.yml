app:
  description: 'Nhập nội dung chương trình/sản phẩm → AI tạo image prompt → sinh
    ấn phẩm quảng cáo đúng thương hiệu Upharma'
  icon: 🎨
  icon_background: '#E0F7FA'
  icon_type: emoji
  mode: workflow
  name: Upharma Ad Image Generator
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-build_prompt
      source: start
      target: build_prompt
      type: custom
    - id: build_prompt-end
      source: build_prompt
      target: end
      type: custom
    nodes:
    - data:
        title: Start
        type: start
        variables:
        - label: Nội dung chương trình / sản phẩm
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: promo_content
        - label: 'Loại ấn phẩm: poster / banner / story / flyer'
          max_length: 50
          options: []
          required: true
          type: text-input
          variable: format_type
      height: 116
      id: start
      position:
        x: 50
        y: 200
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Tạo image prompt theo thương hiệu Upharma
        model:
          completion_params:
            temperature: 0.3
            max_tokens: 400
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: "Bạn là chuyên gia thiết kế ấn phẩm cho chuỗi nhà thuốc Upharma.\n\
            Nhận dạng thương hiệu:\n- Màu chủ đạo: xanh dương đậm (#0057A8) + trắng\n\
            - Font: sans-serif hiện đại\n- Phong cách: chuyên nghiệp y tế, tin cậy\n\
            Tạo image generation prompt tiếng Anh cho DALL-E để tạo ấn phẩm {{#start.format_type#}}.\n\
            Chỉ trả về prompt, không giải thích."
        - role: user
          text: "Nội dung: {{#start.promo_content#}}\nLoại ấn phẩm: {{#start.format_type#}}"
        title: Tạo image prompt
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: build_prompt
      position:
        x: 380
        y: 200
      type: custom
      width: 244
    - data:
        outputs:
        - value_selector:
          - build_prompt
          - text
          variable: image_prompt
        title: End
        type: end
      height: 54
      id: end
      position:
        x: 710
        y: 200
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
