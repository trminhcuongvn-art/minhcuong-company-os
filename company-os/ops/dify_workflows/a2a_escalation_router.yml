app:
  description: 'Nhận escalation từ agent bị BLOCKED, phân tích blocker và đưa ra
    next_action cụ thể cho Cáo xử lý'
  icon: 🦊
  icon_background: '#FFF3E0'
  icon_type: emoji
  mode: workflow
  name: A2A Escalation Router
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-analyze
      source: start
      target: analyze
      type: custom
    - id: analyze-end
      source: analyze
      target: end
      type: custom
    nodes:
    - data:
        title: Start
        type: start
        variables:
        - label: Tên agent bị BLOCKED
          max_length: 50
          options: []
          required: true
          type: text-input
          variable: agent_name
        - label: Task ID
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: task_id
        - label: 'Status: BLOCKED / PARTIAL / DONE'
          max_length: 20
          options: []
          required: true
          type: text-input
          variable: status
        - label: Mô tả blocker
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: blocker_description
      height: 116
      id: start
      position:
        x: 50
        y: 200
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Cáo phân tích blocker và đưa ra next_action
        model:
          completion_params:
            temperature: 0.2
            max_tokens: 512
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: "Bạn là Cáo — Technical Advisor của Tập đoàn Minh Cường.\nNhiệm vụ:\
            \ Nhận escalation từ agent bị BLOCKED, phân tích và đưa ra next_action.\n\
            Format trả lời:\n[CÁO] ESCALATION RECEIVED\nAgent: <tên>\nTask: <task_id>\n\
            Blocker: <tóm tắt>\nNext Action: <ai làm gì, trong bao lâu>\nDeadline:\
            \ <thời hạn>\nEscalate to Henry: YES/NO"
        - role: user
          text: "Agent: {{#start.agent_name#}}\nTask ID: {{#start.task_id#}}\nStatus:\
            \ {{#start.status#}}\nBlocker: {{#start.blocker_description#}}"
        title: Cáo phân tích escalation
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: analyze
      position:
        x: 380
        y: 200
      type: custom
      width: 244
    - data:
        outputs:
        - value_selector:
          - analyze
          - text
          variable: next_action
        title: End
        type: end
      height: 54
      id: end
      position:
        x: 710
        y: 200
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
