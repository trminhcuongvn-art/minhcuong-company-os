app:
  description: 'Trợ Lý COO Task Coordinator — intake, dispatch, checkpoint for agent tasks'
  icon: 🎯
  icon_background: '#E0F0FF'
  mode: workflow
  name: Troly Task Coordinator
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: end
      id: start-source-end-target
      source: 'start'
      sourceHandle: source
      target: 'end'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'COO task coordinator intake'
        title: Start
        type: start
        variables:
        - label: task_name
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: task_name
        - label: owner_agent
          max_length: 100
          options: []
          required: true
          type: select
          options:
          - bong
          - bun
          - render
          - antigravity
          - cao
          variable: owner_agent
        - label: priority
          max_length: 10
          options: [P0, P1, P2]
          required: true
          type: select
          variable: priority
        - label: deadline
          max_length: 50
          options: []
          required: true
          type: text-input
          variable: deadline
        - label: acceptance_criteria
          max_length: 500
          options: []
          required: true
          type: paragraph
          variable: acceptance_criteria
      height: 282
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: "TASK DISPATCHED\nName: {{#start.task_name#}}\nOwner: {{#start.owner_agent#}}\nPriority: {{#start.priority#}}\nDeadline: {{#start.deadline#}}\nAcceptance: {{#start.acceptance_criteria#}}"
        desc: Return dispatch confirmation
        title: End
        type: end
        outputs:
        - value_selector: [start, task_name]
          variable: task_name
        - value_selector: [start, owner_agent]
          variable: owner_agent
        - value_selector: [start, priority]
          variable: priority
        - value_selector: [start, deadline]
          variable: deadline
      height: 116
      id: end
      position:
        x: 440
        y: 282
      positionAbsolute:
        x: 440
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
